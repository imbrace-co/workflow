# ----------------------------------------------------------------------------
# Database migrations are NOT run by the `backend` container — server boot only
# opens the DB connection. The one-shot `db-migrate` service below runs
# `npm run db:migrate` against postgres, applies pending migrations + seeds,
# and exits. `backend` waits for it via `service_completed_successfully`.
# See docs/HORIZONTAL_WORKER_SCALING.md → "Database migrations".
# ----------------------------------------------------------------------------
services:
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: build      # reuse the build stage (has source + nx + ts-node)
    container_name: ap-db-migrate
    working_dir: /usr/src/app
    command: ["npx", "nx", "db-migrate", "server-api"]
    env_file:
      - .env.local
    networks:
      - activepieces
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: ap-engine
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env.local
    networks:
      - activepieces
    volumes:
      - engine_codes:/usr/src/app/codes
      - engine_cache:/usr/src/app/cache
    depends_on:
      - postgres
      - redis
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ap-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    networks:
      - activepieces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.local
      args:
        - AP_APP_TITLE=${AP_APP_TITLE:-Activepieces (Dev)}
        - AP_FAVICON_URL=${AP_FAVICON_URL:-https://cdn.activepieces.com/brand/favicon.ico}
        - AP_FRONTEND_URL=${AP_FRONTEND_URL:-http://localhost:4200}
        - AP_ENVIRONMENT=development
    container_name: ap-frontend
    restart: unless-stopped
    ports:
      - '4200:4200'
    networks:
      - activepieces
    depends_on:
      - postgres
      - redis
      - engine
      - backend
    volumes:
      - ./.env.frontend.dev:/app/.env:ro
  postgres:
    image: 'postgres:14.4'
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    env_file: .env.local
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - activepieces
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AP_POSTGRES_USERNAME} -d ${AP_POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: 'redis:7.0.7'
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
    networks:
      - activepieces
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  engine_codes:
  engine_cache:
  postgres_data:
  redis_data:
networks:
  activepieces:
