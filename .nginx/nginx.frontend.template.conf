events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;

    server {
        listen 4200;
        server_name localhost;

        # Strip the configured base path prefix (e.g. /apwf) so files still resolve from root.
        # The entrypoint replaces this marker only when BASE_PATH is set; otherwise it stays a comment.
        # __BASE_PATH_REWRITE__

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Allow iframe embedding from localhost:4000 (dashboard) and the env webapp origin.
        # ${WEBAPP_ORIGIN} is substituted at container start (e.g. https://webapp.sandbox.imbrace.co).
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:3000 https://localhost:3000 http://localhost:4000 https://localhost:4000 ${WEBAPP_ORIGIN};" always;

        # Serve static frontend files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Dynamic runtime configuration endpoint
        location /config {
            alias /usr/share/nginx/html/env.json;
            default_type application/json;
        }

        # Proxy API calls to webhooks
        # ${BACKEND_UPSTREAM} is substituted at container start (e.g. http://apwf.sandbox.imbrace.lan:3000).
        location /api/v1/webhooks/ {
            rewrite ^/api/v1/webhooks/(.*)$ /v1/webhooks/$1 break;
            proxy_pass ${BACKEND_UPSTREAM};

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve request method and body
            proxy_method $request_method;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_pass_request_body on;
            proxy_pass_request_headers on;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Proxy Socket.IO WebSocket connections
        location /api/socket.io/ {
            rewrite ^/api/socket.io/(.*)$ /socket.io/$1 break;
            proxy_pass ${BACKEND_UPSTREAM};

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Essential WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Longer timeouts for persistent connections
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # Proxy API calls to gateway service
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass ${BACKEND_UPSTREAM};

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve request method and body
            proxy_method $request_method;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_pass_request_body on;
            proxy_pass_request_headers on;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # Health check endpoint
        location /health {
            return 200 '{"status":"healthy","service":"frontend"}';
            add_header Content-Type "application/json";
        }

    }
}
