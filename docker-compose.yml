version: '3.8'

services:
  backend:
    image: ${ap_backend_image_tag}
    container_name: ap-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    networks:
      - core-net

  engine:
    image: ${ap_engine_image_tag}
    container_name: ap-engine
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env.engine
    networks:
      - core-net
    volumes:
      - engine_codes:/usr/src/app/codes
      - engine_cache:/usr/src/app/cache

  frontend:
    image: ${ap_frontend_image_tag}
    container_name: ap-frontend
    restart: unless-stopped
    ports:
      - '4200:4200'
    networks:
      - core-net
    volumes:
      - ./.env.frontend:/app/.env:ro

volumes:
  engine_codes:
  engine_cache:

networks:
  core-net:
    external: true
    name: core-net
